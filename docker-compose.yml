services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: trotamundos
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d trotamundos"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  agency-mock:
    build:
      context: .
      args:
        SERVICE: agency-mock
    environment:
      PORT: "8089"

  itinerary-service:
    build:
      context: .
      args:
        SERVICE: itinerary-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://trotamundos:trotamundos@postgres:5432/trotamundos?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKER: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  chatbot-service:
    build:
      context: .
      args:
        SERVICE: chatbot-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://trotamundos:trotamundos@postgres:5432/trotamundos?sslmode=disable
      ITINERARY_SERVICE_URL: http://itinerary-service:8081
      AGENCY_MOCK_URL: http://agency-mock:8089
      SERVICE_TOKEN: trotamundos-internal-service-token
      KAFKA_BROKER: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      itinerary-service:
        condition: service_started
      agency-mock:
        condition: service_started

  web-bff:
    build:
      context: .
      args:
        SERVICE: web-bff
    environment:
      PORT: "8080"
      ITINERARY_SERVICE_URL: http://itinerary-service:8081
      CHATBOT_SERVICE_URL: http://chatbot-service:8082
      AGENCY_MOCK_URL: http://agency-mock:8089
      WEB_DIR: /app/web
      OPENAPI_PATH: /app/api/openapi.yaml
    ports:
      - "8080:8080"
    depends_on:
      - itinerary-service
      - chatbot-service
      - agency-mock
